<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusShelf — Smart Student Book Exchange</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 12px;
      --shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f8fafc;
      color: var(--text-main);
    }
    header {
      background: #0f172a;
      color: white;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }
    .tab-btn {
      padding: 8px 16px;
      background: #e2e8f0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin: 6px 0 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: inherit;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      display: inline-block;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-borrow { background: #e0e7ff; color: #4338ca; }
    .badge-sell { background: #fef3c7; color: #b45309; }
    .badge-donate { background: #dcfce7; color: #15803d; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
    th { background: #f1f5f9; }
    /* Modal */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center;
    }
    .modal-content {
      background: white; padding: 25px; border-radius: var(--radius); width: 450px;
    }
  </style>
</head>
<body>

<header>
  <div style="font-weight: 800; font-size: 1.2rem;">📚 CampusShelf</div>
  <div id="auth-header">
    <button class="btn btn-primary" onclick="openAuthModal()">Login / Register</button>
  </div>
</header>

<div class="container">
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('browse')">Browse Books</button>
    <button class="tab-btn" id="tab-listings-btn" style="display:none;" onclick="switchTab('listings')">My Listings</button>
    <button class="tab-btn" id="tab-payments-btn" style="display:none;" onclick="switchTab('payments')">Payment History</button>
    <button class="tab-btn" id="tab-admin-btn" style="display:none; background:#dc2626; color:white;" onclick="switchTab('admin')">Admin Console</button>
  </div>

  <!-- Browse Books Section -->
  <section id="section-browse">
    <div style="display: flex; gap: 15px; margin-bottom: 20px;">
      <input type="text" id="search-input" placeholder="Search by title or author..." onkeyup="filterBooks()">
      <select id="filter-type" style="width: 200px;" onchange="filterBooks()">
        <option value="ALL">All Types</option>
        <option value="BORROW">Borrow</option>
        <option value="SELL">Buy / Sell</option>
        <option value="DONATE">Donate</option>
      </select>
    </div>
    <div class="grid" id="books-grid"></div>
  </section>

  <!-- My Listings Section -->
  <section id="section-listings" style="display:none;">
    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px;">
      <div class="card">
        <h3>Post a Book</h3>
        <label>Title</label><input type="text" id="post-title">
        <label>Author</label><input type="text" id="post-author">
        <label>Listing Type</label>
        <select id="post-type">
          <option value="BORROW">Borrow / Lend</option>
          <option value="SELL">Sell</option>
          <option value="DONATE">Donate</option>
        </select>
        <label>Price (₹)</label><input type="number" id="post-price" value="0">
        <label>Description</label><textarea id="post-desc" rows="3"></textarea>
        <button class="btn btn-primary" style="width:100%;" onclick="submitBook()">Publish</button>
      </div>
      <div class="card">
        <h3>My Active Listings</h3>
        <div id="my-books-container"></div>
      </div>
    </div>
  </section>

  <!-- Payment History Section -->
  <section id="section-payments" style="display:none;">
    <div class="card">
      <h3>My Payment Transactions</h3>
      <table>
        <thead>
          <tr><th>ID</th><th>Book Title</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr>
        </thead>
        <tbody id="user-payment-table"></tbody>
      </table>
    </div>
  </section>

  <!-- Admin Panel Section -->
  <section id="section-admin" style="display:none;">
    <div class="card" style="margin-bottom: 20px;">
      <h3>Platform Users</h3>
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Action</th></tr></thead>
        <tbody id="admin-users-table"></tbody>
      </table>
    </div>

    <div class="card" style="margin-bottom: 20px;">
      <h3>All Platform Listings</h3>
      <table>
        <thead><tr><th>ID</th><th>Title</th><th>Owner</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="admin-books-table"></tbody>
      </table>
    </div>

    <div class="card">
      <h3>All Platform Payments</h3>
      <table>
        <thead><tr><th>ID</th><th>Payer</th><th>Book</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
        <tbody id="admin-payments-table"></tbody>
      </table>
    </div>
  </section>
</div>

<!-- Book Details Modal -->
<div class="modal" id="details-modal">
  <div class="modal-content">
    <h3 id="modal-title"></h3>
    <p style="color: var(--text-muted); margin: 6px 0;" id="modal-author"></p>
    <p id="modal-desc" style="margin: 15px 0; font-size: 0.95rem;"></p>
    <div style="font-weight: 700; margin-bottom: 15px;" id="modal-price"></div>
    <div id="modal-actions" style="display: flex; gap: 10px;"></div>
    <button class="btn" style="margin-top:10px; width:100%; background:#e2e8f0;" onclick="closeModal()">Close</button>
  </div>
</div>

<!-- Auth Modal -->
<div class="modal" id="auth-modal">
  <div class="modal-content">
    <h3>Sign In / Register</h3>
    <input type="text" id="auth-name" placeholder="Full Name (For register)">
    <input type="email" id="auth-email" placeholder="Email">
    <input type="password" id="auth-password" placeholder="Password">
    <div style="margin-bottom: 10px;">
      <label><input type="checkbox" id="auth-admin-toggle"> Register as Admin</label>
    </div>
    <button class="btn btn-primary" style="width: 100%;" onclick="login()">Login</button>
    <button class="btn btn-success" style="width: 100%; margin-top: 8px;" onclick="register()">Register</button>
    <button class="btn" style="width: 100%; margin-top: 8px; background:#e2e8f0;" onclick="closeAuthModal()">Cancel</button>
  </div>
</div>

<script>
  let currentUser = null;
  let allBooks = [];

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('section-browse').style.display = 'none';
    document.getElementById('section-listings').style.display = 'none';
    document.getElementById('section-payments').style.display = 'none';
    document.getElementById('section-admin').style.display = 'none';

    document.getElementById(`section-${tab}`).style.display = 'block';

    if (tab === 'browse') loadAvailableBooks();
    if (tab === 'listings') loadUserBooks();
    if (tab === 'payments') loadUserPayments();
    if (tab === 'admin') loadAdminData();
  }

  function openAuthModal() { document.getElementById('auth-modal').style.display = 'flex'; }
  function closeAuthModal() { document.getElementById('auth-modal').style.display = 'none'; }
  function closeModal() { document.getElementById('details-modal').style.display = 'none'; }

  async function register() {
    const role = document.getElementById('auth-admin-toggle').checked ? 'ROLE_ADMIN' : 'ROLE_USER';
    const payload = {
      name: document.getElementById('auth-name').value,
      email: document.getElementById('auth-email').value,
      password: document.getElementById('auth-password').value,
      role: role
    };
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) alert('Registration successful! Please login.');
    else alert('Registration failed.');
  }

  async function login() {
    const payload = {
      email: document.getElementById('auth-email').value,
      password: document.getElementById('auth-password').value
    };
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      currentUser = await res.json();
      closeAuthModal();
      document.getElementById('auth-header').innerHTML = `
        <span>Logged as: <b>${currentUser.name}</b> (${currentUser.role})</span>
        <button class="btn btn-danger" style="margin-left: 10px;" onclick="location.reload()">Logout</button>
      `;
      document.getElementById('tab-listings-btn').style.display = 'inline-block';
      document.getElementById('tab-payments-btn').style.display = 'inline-block';
      if (currentUser.role === 'ROLE_ADMIN') {
        document.getElementById('tab-admin-btn').style.display = 'inline-block';
      }
      loadAvailableBooks();
    } else {
      alert('Invalid login credentials.');
    }
  }

  async function loadAvailableBooks() {
    const res = await fetch('/api/books');
    allBooks = await res.json();
    renderBooks(allBooks);
  }

  function filterBooks() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const type = document.getElementById('filter-type').value;

    const filtered = allBooks.filter(b => {
      const matchSearch = b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query);
      const matchType = type === 'ALL' || b.listingType === type;
      return matchSearch && matchType;
    });
    renderBooks(filtered);
  }

  function renderBooks(books) {
    const grid = document.getElementById('books-grid');
    grid.innerHTML = books.length ? '' : '<p>No matching books found.</p>';
    books.forEach(b => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <span class="badge badge-${b.listingType.toLowerCase()}">${b.listingType}</span>
        <h4 style="margin: 8px 0 4px;">${b.title}</h4>
        <p style="font-size: 0.85rem; color: var(--text-muted);">by ${b.author}</p>
        <p style="font-weight: 700; margin: 8px 0;">${b.price > 0 ? '₹' + b.price : 'Free'}</p>
        <button class="btn btn-primary" style="width: 100%;" onclick="openBookDetails(${b.id})">View Details</button>
      `;
      grid.appendChild(div);
    });
  }

  async function openBookDetails(bookId) {
    const res = await fetch(`/api/books/${bookId}`);
    const b = await res.json();
    document.getElementById('modal-title').innerText = b.title;
    document.getElementById('modal-author').innerText = `by ${b.author}`;
    document.getElementById('modal-desc').innerText = b.description || "No description provided.";
    document.getElementById('modal-price').innerText = b.price > 0 ? `Price: ₹${b.price}` : 'Listing: Free';

    const actions = document.getElementById('modal-actions');
    actions.innerHTML = '';

    if (currentUser && b.owner && b.owner.id !== currentUser.id) {
      if (b.listingType === 'SELL') {
        actions.innerHTML = `<button class="btn btn-success" style="width:100%;" onclick="processBuy(${b.id})">Buy Now</button>`;
      } else {
        actions.innerHTML = `<button class="btn btn-primary" style="width:100%;" onclick="borrowBook(${b.id})">Request to Borrow</button>`;
      }
    }
    document.getElementById('details-modal').style.display = 'flex';
  }

  async function processBuy(bookId) {
    const res = await fetch('/api/payments/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bookId: bookId, userId: currentUser.id, paymentMethod: 'UPI / Online' })
    });
    if (res.ok) {
      alert('Payment successful! The book has been marked as SOLD.');
      closeModal();
      loadAvailableBooks();
    } else {
      const err = await res.text();
      alert(err);
    }
  }

  async function borrowBook(bookId) {
    const res = await fetch('/api/requests/borrow', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bookId: bookId, requesterId: currentUser.id })
    });
    if (res.ok) {
      alert('Borrow request submitted!');
      closeModal();
    } else {
      const err = await res.text();
      alert(err);
    }
  }

  async function submitBook() {
    const payload = {
      title: document.getElementById('post-title').value,
      author: document.getElementById('post-author').value,
      listingType: document.getElementById('post-type').value,
      price: parseFloat(document.getElementById('post-price').value) || 0,
      description: document.getElementById('post-desc').value,
      owner: currentUser
    };
    await fetch('/api/books', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    alert('Listing added!');
    loadUserBooks();
  }

  async function loadUserBooks() {
    const res = await fetch(`/api/books/user/${currentUser.id}`);
    const books = await res.json();
    const container = document.getElementById('my-books-container');
    container.innerHTML = books.length ? '' : '<p>You have not posted any books yet.</p>';
    books.forEach(b => {
      const div = document.createElement('div');
      div.style.cssText = 'display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding:10px 0;';
      div.innerHTML = `
        <div>
          <b>${b.title}</b> (${b.listingType}) - <small>${b.status}</small>
        </div>
        <button class="btn btn-danger" onclick="deleteBook(${b.id})">Delete</button>
      `;
      container.appendChild(div);
    });
  }

  async function deleteBook(id) {
    if (!confirm('Are you sure you want to delete this listing?')) return;
    await fetch(`/api/books/${id}`, { method: 'DELETE' });
    loadUserBooks();
    loadAvailableBooks();
  }

  async function loadUserPayments() {
    const res = await fetch(`/api/payments/user/${currentUser.id}`);
    const payments = await res.json();
    const tbody = document.getElementById('user-payment-table');
    tbody.innerHTML = payments.map(p => `
      <tr>
        <td>#${p.id}</td>
        <td>${p.book.title}</td>
        <td>₹${p.amount}</td>
        <td>${p.paymentMethod}</td>
        <td><b style="color:var(--success);">${p.paymentStatus}</b></td>
        <td>${p.timestamp ? p.timestamp.replace('T', ' ').substring(0, 16) : 'N/A'}</td>
      </tr>
    `).join('');
  }

  async function loadAdminData() {
    // Fetch users
    const userRes = await fetch('/api/admin/users');
    const users = await userRes.json();
    document.getElementById('admin-users-table').innerHTML = users.map(u => `
      <tr>
        <td>${u.id}</td><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td>
        <td><button class="btn btn-danger" onclick="adminDeleteUser(${u.id})">Delete</button></td>
      </tr>
    `).join('');

    // Fetch all books
    const bookRes = await fetch('/api/admin/books');
    const books = await bookRes.json();
    document.getElementById('admin-books-table').innerHTML = books.map(b => `
      <tr>
        <td>${b.id}</td><td>${b.title}</td><td>${b.owner ? b.owner.email : 'None'}</td><td>${b.status}</td>
        <td><button class="btn btn-danger" onclick="adminDeleteBook(${b.id})">Remove</button></td>
      </tr>
    `).join('');

    // Fetch all payments
    const payRes = await fetch('/api/admin/payments');
    const payments = await payRes.json();
    document.getElementById('admin-payments-table').innerHTML = payments.map(p => `
      <tr>
        <td>#${p.id}</td><td>${p.user ? p.user.name : 'Unknown'}</td><td>${p.book ? p.book.title : 'Deleted'}</td>
        <td>₹${p.amount}</td><td>${p.paymentStatus}</td><td>${p.timestamp ? p.timestamp.replace('T', ' ').substring(0, 16) : 'N/A'}</td>
      </tr>
    `).join('');
  }

  async function adminDeleteUser(id) {
    if (!confirm('Delete user?')) return;
    await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
    loadAdminData();
  }

  async function adminDeleteBook(id) {
    if (!confirm('Delete book?')) return;
    await fetch(`/api/admin/books/${id}`, { method: 'DELETE' });
    loadAdminData();
  }

  loadAvailableBooks();
</script>
</body>
</html>
